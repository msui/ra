<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relationship Anarchy Smorgasbord Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Agu+Display&family=Arimo:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#7c4dff;
    --accent-dark:#5e35b1;
    --bg:#faf7f5;
    --card:#ffffff;
    --ink:#2b2530;
    --muted:#7a7280;
    --line:#eee3e8;
    --platter:#2e7d32;
    --platter-bg:#e9f6ea;
    --discuss:#b45309;
    --discuss-bg:#fff4e2;
    --parked:#6b6470;
    --parked-bg:#f2eef3;
    --danger:#c0392b;
    --radius:14px;
    /* animated background blob palette — soft, pastel versions of the accent/cert colors above */
    --g-bg1:#f7f1fb;
    --g-bg2:#fdf3f6;
    --g-c1:124,77,255;
    --g-c2:200,109,215;
    --g-c3:110,200,180;
    --g-c4:221,178,90;
    --g-c5:230,150,170;
    --g-c-interactive:150,120,255;
    --g-circle-size:60%;
    --g-blend:soft-light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    /* base typeface for all body copy and non-uppercase headings; uppercase text overrides to
       Arimo, and the "Let's Make A Smorgasbord" headers / Step 1 & 2 labels override to Agu
       Display -- see .brand-title, .hero-title, .step-label, and the uppercase selectors below */
    font-family:'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
  }

  /* ---- animated morphing-gradient background: soft, drifting blurred color blobs behind
     every screen, adapted from the goo-filter technique in https://youtu.be/Ml-B-W91gtw
     (baunov/gradients-bg), recolored to match this app's own palette instead of the original's
     saturated purple/blue neon look. Pure-CSS keyframe animation; safe/inert in non-visual
     environments (no JS animation loop, so it can't hang a headless test run). ---- */
  @keyframes gMoveInCircle{0%{transform:rotate(0deg);}50%{transform:rotate(180deg);}100%{transform:rotate(360deg);}}
  @keyframes gMoveVertical{0%{transform:translateY(-50%);}50%{transform:translateY(50%);}100%{transform:translateY(-50%);}}
  @keyframes gMoveHorizontal{0%{transform:translateX(-50%) translateY(-10%);}50%{transform:translateX(50%) translateY(10%);}100%{transform:translateX(-50%) translateY(-10%);}}
  .gradient-bg{
    position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:linear-gradient(40deg,var(--g-bg1),var(--g-bg2));
  }
  .gradient-bg svg{position:fixed;top:0;left:0;width:0;height:0;}
  /* halved from 0.6 -- this is the common parent of every blob (g1-g5 plus the mouse-following
     .interactive one), so halving it here scales all of them down uniformly in one place
     rather than halving each blob's own opacity individually. */
  .gradient-bg .gradients-container{filter:url(#goo) blur(40px);width:100%;height:100%;opacity:0.3;}
  .gradient-bg .g1,.gradient-bg .g2,.gradient-bg .g3,.gradient-bg .g4,.gradient-bg .g5,.gradient-bg .interactive{
    position:absolute;mix-blend-mode:var(--g-blend);
  }
  .gradient-bg .g1{
    background:radial-gradient(circle at center,rgba(var(--g-c1),0.8) 0,rgba(var(--g-c1),0) 50%) no-repeat;
    width:var(--g-circle-size);height:var(--g-circle-size);
    top:calc(50% - var(--g-circle-size) / 2);left:calc(50% - var(--g-circle-size) / 2);
    transform-origin:center center;animation:gMoveVertical 60s ease infinite;
  }
  .gradient-bg .g2{
    background:radial-gradient(circle at center,rgba(var(--g-c2),0.8) 0,rgba(var(--g-c2),0) 50%) no-repeat;
    width:var(--g-circle-size);height:var(--g-circle-size);
    top:calc(50% - var(--g-circle-size) / 2);left:calc(50% - var(--g-circle-size) / 2);
    transform-origin:calc(50% - 400px);animation:gMoveInCircle 40s reverse infinite;
  }
  .gradient-bg .g3{
    background:radial-gradient(circle at center,rgba(var(--g-c3),0.8) 0,rgba(var(--g-c3),0) 50%) no-repeat;
    width:var(--g-circle-size);height:var(--g-circle-size);
    top:calc(50% - var(--g-circle-size) / 2 + 200px);left:calc(50% - var(--g-circle-size) / 2 - 500px);
    transform-origin:calc(50% + 400px);animation:gMoveInCircle 80s linear infinite;
  }
  .gradient-bg .g4{
    background:radial-gradient(circle at center,rgba(var(--g-c4),0.8) 0,rgba(var(--g-c4),0) 50%) no-repeat;
    width:var(--g-circle-size);height:var(--g-circle-size);
    top:calc(50% - var(--g-circle-size) / 2);left:calc(50% - var(--g-circle-size) / 2);
    transform-origin:calc(50% - 200px);animation:gMoveHorizontal 80s ease infinite;opacity:0.7;
  }
  .gradient-bg .g5{
    background:radial-gradient(circle at center,rgba(var(--g-c5),0.8) 0,rgba(var(--g-c5),0) 50%) no-repeat;
    width:calc(var(--g-circle-size) * 2);height:calc(var(--g-circle-size) * 2);
    top:calc(50% - var(--g-circle-size));left:calc(50% - var(--g-circle-size));
    transform-origin:calc(50% - 800px) calc(50% + 200px);animation:gMoveInCircle 40s ease infinite;
  }
  .gradient-bg .interactive{
    background:radial-gradient(circle at center,rgba(var(--g-c-interactive),0.7) 0,rgba(var(--g-c-interactive),0) 50%) no-repeat;
    width:100%;height:100%;top:-50%;left:-50%;opacity:0.5;
    transition:transform 0.6s cubic-bezier(0.2,0.8,0.2,1);
  }
  @media (prefers-reduced-motion: reduce){
    /* Freeze every blob at its animation's 0% keyframe position instead of letting
       `animation:none` silently drop the transform back to its un-animated default
       (which would shift g1/g4 to an undesigned spot). The result is a deliberate,
       fixed "static blobby image" -- nothing drifts and nothing follows the mouse. */
    .gradient-bg .g1{animation:none;transform:translateY(-50%);}
    .gradient-bg .g2{animation:none;transform:rotate(0deg);}
    .gradient-bg .g3{animation:none;transform:rotate(0deg);}
    .gradient-bg .g4{animation:none;transform:translateX(-50%) translateY(-10%);}
    .gradient-bg .g5{animation:none;transform:rotate(0deg);}
    .gradient-bg .interactive{transition:none;}
  }
  @media (max-width:700px){
    .gradient-bg .gradients-container{filter:url(#goo) blur(22px);}
  }
  @media print{.gradient-bg{display:none;}}

  #app{max-width:880px;margin:0 auto;padding:24px 18px 80px;position:relative;z-index:1;}
  h1,h2,h3{line-height:1.25;}
  h1{font-size:1.6rem;margin:0 0 6px;}
  h2{font-size:1.25rem;margin:0 0 4px;}
  h3{font-size:1.05rem;margin:0;}
  p{margin:0 0 12px;}
  .muted{color:var(--muted);font-size:0.92rem;}
  a{color:var(--accent-dark);}
  a:hover{color:var(--accent);}
  /* iOS-style frosted glass: a translucent white fill blurs whatever's behind it (the
     animated gradient blobs) instead of hiding it outright. The 0.74 alpha is deliberately
     high rather than a "true" see-through glass look -- the blob palette is soft/pastel
     (see --g-bg1/--g-bg2/--g-c1..5 above) with nothing near-black behind it, but that alpha
     still guarantees the *composited* background stays light enough for --ink (#2b2530) text
     to clear the WCAG AA 4.5:1 contrast minimum even in a worst-case fully-opaque blob behind
     the panel, without having to trust exactly where the blur lands. Browsers without
     backdrop-filter support (the @supports block below) get a plain solid card instead of a
     dark, illegible see-through one. */
  .card{
    background:rgba(255,255,255,0.74);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 24px rgba(60,30,60,0.06);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .card,.accordion-header:not(.open),.accordion-body{background:var(--card) !important;}
    .tile,.category-header.with-hint{background:linear-gradient(135deg,#411c6e,#180a2a) !important;}
  }
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent);color:#fff;border:none;
    padding:11px 18px;border-radius:10px;font-size:0.95rem;font-weight:600;
    cursor:pointer;transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--accent-dark);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{background:#cfc7d6;cursor:not-allowed;}
  .btn.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
  .btn.secondary:hover{background:#f4effd;}
  /* .btn.secondary's own background/border/color (same specificity as .btn:disabled, declared
     later in the stylesheet) otherwise wins the cascade and quietly cancels the disabled
     look -- a disabled secondary button read as a perfectly normal, clickable one. */
  .btn.secondary:disabled{background:#f7f5f8;color:#a89db3;border-color:#ddd4e6;cursor:not-allowed;}
  /* the default --muted/--line pair (used elsewhere for text on solid white cards, where it's fine)
     only measures ~4.2:1 text / ~1.1:1 border against this page's light gradient background --
     short of the WCAG AA 4.5:1 text and 3:1 UI-boundary minimums. Darkened here so the top-bar's
     "Home"/"Start Over" buttons (the only place this base rule actually renders -- the tile and
     hint-toggle variants both override it) stay comfortably compliant: ~6.4-6.6:1 text, ~3.6-3.7:1 border. */
  .btn.ghost{background:transparent;color:#5c5566;border:1px solid #8d7899;font-weight:500;padding:8px 14px;font-size:0.85rem;}
  .btn.ghost:hover{background:#f4f0f2;}
  .btn.small{padding:7px 12px;font-size:0.82rem;border-radius:8px;}
  .btn.danger-outline{background:#fff;color:var(--danger);border:1.5px solid #f0c7c2;}
  .btn.danger-outline:hover{background:#fdf1ef;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row.between{justify-content:space-between;}
  /* Rate/Combine/Results header -- same icon-top, left-aligned, stacked layout as the Home
     hero below (icon+eyebrow row, then title, then subtitle, then actions), just always
     left-aligned rather than centering at wider breakpoints, and without the hero's huge
     display-size title. Replaces the old side-by-side icon+text row, which broke down once
     the title switched to the wider Agu Display face: the fixed-height badge either
     overlapped the taller multi-line text block next to it, or (once top-aligned) still
     collided with the title line directly below the eyebrow. */
  .top-bar{margin-bottom:22px;}
  .top-bar-eyebrow-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .brand-badge{
    width:35px;height:35px;border-radius:50%;background:var(--accent);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.05rem;line-height:1;
  }
  .brand-eyebrow{
    font-family:'Arimo',Arial,sans-serif;font-weight:700;font-size:0.85rem;
    letter-spacing:0.15em;text-transform:uppercase;margin:0;color:var(--ink);
  }
  .brand-title{
    font-family:'Agu Display','Arimo',Arial,sans-serif;font-variation-settings:"MORF" 30;
    font-size:2rem;font-weight:400;margin:0 0 10px;line-height:1.15;letter-spacing:0.05em;
  }
  .top-bar-subtitle{font-size:0.92rem;margin-bottom:16px;max-width:640px;}

  /* ---- home hero: matches the Figma "after" mock (icon + eyebrow, big display headline,
     description, actions) -- only used on the home screen; other screens keep the compact
     .top-bar above but share its fonts/logo for visual consistency. ---- */
  /* default (medium/wide, >=700px): centered, matching the Figma desktop "after" mock */
  .hero{margin-bottom:22px;text-align:center;}
  .hero-eyebrow-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;}
  .hero-eyebrow{
    font-family:'Arimo',Arial,sans-serif;font-weight:700;font-size:1rem;
    letter-spacing:0.15em;text-transform:uppercase;margin:0;color:var(--ink);
  }
  .hero-title{
    font-family:'Agu Display','Arimo',Arial,sans-serif;font-variation-settings:"MORF" 30;
    font-size:3.4rem;line-height:1.04;letter-spacing:0.05em;font-weight:400;
    margin:0 0 16px;color:var(--ink);
  }
  .hero-description{
    font-family:'Atkinson Hyperlegible',Arial,sans-serif;font-size:1.125rem;line-height:1.5;
    margin:0 auto 18px;color:var(--ink);max-width:520px; /* forces the wrap after "quiz," at wide breakpoints, per Figma */
  }
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
  /* mobile (<700px): left-aligned, matching the Figma mobile "after" mock.
     font-size here is only the no-JS fallback -- fitHeroTitle() overrides it with a size
     tuned to the actual viewport so "Smorgasbord" fills the width without overflowing. */
  @media (max-width:700px){
    .hero-title{font-size:2.5rem;}
    .tile h3 .step-label{font-size:2.5rem;}
    .hero{text-align:left;}
    .hero-eyebrow-row{flex-direction:row;justify-content:flex-start;}
    .hero-description{margin-left:0;margin-right:0;}
    .hero-actions{justify-content:flex-start;}
  }
  input[type=text]{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font-size:0.98rem;font-family:inherit;background:#fff;color:var(--ink);
  }
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  label.field-label{display:block;font-weight:600;font-size:0.85rem;margin-bottom:6px;color:var(--ink);}
  .field-label-note{font-weight:400;font-style:italic;}
  /* shown when Save/Export is attempted without a name -- see showNameFieldError() -- rather
     than only the transient toast, so the specific field at fault stays visibly flagged until
     it's fixed instead of relying on a message that's already faded by the time you look up. */
  input[type=text].input-error{border-color:var(--danger);background:#fdf1ef;}
  input[type=text].input-error:focus{border-color:var(--danger);}
  .field-error{display:none;align-items:center;gap:6px;color:var(--danger);font-size:0.85rem;font-weight:600;margin-top:6px;}
  .field-error.show{display:flex;}
  select{
    padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;
    font-size:0.92rem;background:#fff;color:var(--ink);
  }
  .category-block{margin-bottom:26px;}
  .category-title{
    font-family:'Arimo',Arial,sans-serif;font-size:1.25rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--accent-dark);margin-bottom:4px;padding-bottom:6px;border-bottom:2px solid #f0e8fb;
  }
  /* .category-title is shared markup between the quiz (rate screen) and the results-page
     accordions; the 1.25rem bump above is scoped to the quiz only, so restore the original
     smaller size specifically inside the results accordions, which weren't part of this ask. */
  .accordion-body .category-title{font-size:0.78rem;}
  /* when hints are on, the title and its description share one box instead of the title
     sitting outside a separate description callout -- same dark-purple glass background as the
     Home screen's Step 1/Step 2 tiles (.tile), see the shared comment there. White text against
     it measures ~8.7:1 worst-case, comfortably clearing the WCAG AA 4.5:1 minimum (the version
     before that reused the progress bar's purple-to-pink gradient, which dipped to ~3.2:1 with
     white text at its lighter/pink end -- swapped out specifically to fix that). */
  .category-header.with-hint{
    background:linear-gradient(135deg,rgba(65,28,110,0.85),rgba(24,10,42,0.85));
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    border-radius:12px;padding:14px 16px;margin-bottom:14px;
  }
  .category-header.with-hint .category-title{color:#fff;border-bottom:none;padding-bottom:0;margin-bottom:8px;}
  .category-desc{font-size:0.85rem;color:#fff;line-height:1.5;}
  .item-row{
    display:flex;flex-direction:column;gap:10px;
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .item-label{font-weight:600;}
  .item-hint{font-size:0.82rem;color:var(--muted);line-height:1.4;margin-top:4px;max-width:520px;}
  /* mobile readability pass, scoped to the quiz's own elements (category-title/desc, item-
     label/hint, pill) -- all only ever rendered on the rate screen, so this can't affect any
     other page. */
  @media (max-width:700px){
    .category-title{font-size:1.4rem;}
    .category-desc{font-size:0.95rem;}
    .item-label{font-size:1.1rem;}
    .item-hint{font-size:0.92rem;}
    .pill{font-size:0.95rem;}
  }
  /* Save-progress ("Save my progress, I'll come back" / "Save") is always the outline
     (secondary) shape, never solid -- but a constant 0.5 opacity made a fully-enabled,
     clickable button visually read as disabled. Full strength while enabled; muted only when
     it's actually disabled (.btn.secondary:disabled, above), same as any other button. */
  /* Save-results ("I'm done! Download my answers" / "Save my results") stays solid at every
     stage, per the ask -- pending (not :disabled -- the button is never actually given the
     disabled attribute, since clicking it while incomplete has to trigger fix-errors mode
     rather than do nothing) just means a muted purple fill instead of the plain "btn"'s
     full-strength one, not a switch to outline/gray. Once every item's rated it drops the
     .pending class entirely and becomes the fully opaque, enabled primary action. */
  #export-ratings-btn.pending{background:rgba(124,77,255,0.5);color:#fff;}
  /* two-column layout for the bottom-of-quiz card: each column is its own copy+button pair
     (save-progress on the left, save-results on the right), rather than one shared paragraph
     above a row of two buttons. align-items:stretch (the grid default) makes both
     .final-actions-col stretch to the taller column's height, so margin-top:auto on the button
     pins it to the bottom of its column at this width while the copy stays top-aligned. */
  .final-actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .final-actions-col{display:flex;flex-direction:column;align-items:flex-start;}
  .final-actions-copy{font-size:0.85rem;margin-bottom:14px;}
  .final-actions-col > .btn{margin-top:auto;}
  /* :not(:empty), not a flat margin-top -- the save column has no trailing hint element after
     its button, so a flat margin on #export-disabled-hint (present even while it renders no
     text) would sit below the export button and throw its bottom edge out of alignment with
     the save button next to it. :empty tracks the live textContent updates in
     syncFinalActionButtons() the same as the initial render, since both just set/clear text. */
  #export-disabled-hint:not(:empty){margin-top:8px;}
  /* mobile: one column, so the two .final-actions-col blocks simply stack in DOM order --
     copy 1, button 1, copy 2, button 2 -- and each column is only as tall as its own content,
     so margin-top:auto on the button has no extra row height to push into (no gap between the
     copy and its button). Buttons go full-width here too, matching the prominence the end of
     the form deserves rather than looking like small secondary buttons. */
  @media (max-width:700px){
    .final-actions-grid{grid-template-columns:1fr;gap:18px;}
    .final-actions-col{align-items:stretch;}
    .final-actions-col > .btn{margin-top:14px;width:100%;justify-content:center;padding:14px 18px;font-size:1rem;}
  }

  /* ---- rating scale: one wrapping row of 4 identically-shaped pill buttons (3 rating options +
     "Skip — discuss later" as a peer, not a secondary button tucked onto its own line below).
     flex-wrap is the key fix for the narrow-viewport/large-font clipping bug: pill text keeps
     white-space:nowrap (so labels never truncate mid-word), and flex-wrap lets pills that no
     longer fit on the current line drop to a new line instead of overflowing the container. ---- */
  .pill-group{display:flex;flex-wrap:wrap;gap:8px;max-width:560px;}
  .pill{
    border:1.5px solid var(--line);background:#fff;color:var(--ink);
    padding:10px 14px;font-size:0.85rem;cursor:pointer;position:relative;
    white-space:nowrap;font-weight:600;border-radius:999px;text-align:center;flex:1 1 120px;
    transition:background .12s ease,border-color .12s ease,color .12s ease,transform .1s ease;
    user-select:none;z-index:1;
  }
  .pill:hover{transform:translateY(-1px);z-index:2;}
  .pill:active{transform:translateY(0);}
  /* at narrow/mobile widths, a 120px flex-basis fits 2 pills per row, so the 4 options land as
     an uneven 2x2 grid -- stack them into one full-width column instead, which also sidesteps
     the wrap-clipping case the flex-basis above exists for, since each pill now owns the row. */
  @media (max-width:700px){
    .pill-group{flex-direction:column;max-width:none;}
    .pill{flex:1 1 auto;width:100%;}
  }
  .pill.selected{z-index:2;}

  /* hover emphasis: hovering one of the 4 pills darkens its own fill a touch and fades the
     *other three* toward white with a softer border, so the one you're pointing at pops -- text
     color is untouched on every pill, only background/border shift. Scoped to the unanswered
     state; once an item has an answer, the existing grey-out-except-selected treatment below
     already provides that same "what am I pointing at" contrast. */
  .pill-group:not(.answered):hover .pill:not(:hover){background:#ffffff;border-color:#e9e3ec;}
  .pill-group .pill.opt-not_interested:hover{background:#fbdcd8;}
  .pill-group .pill.opt-neutral:hover{background:#ffedb0;}
  .pill-group .pill.opt-definitely:hover{background:#d7ecd9;}
  /* hovering Skip/discuss itself brings its blue border back (on top of the darker-blue fill
     it already had), matching the other 3 pills' pattern of a colored border + fill together --
     it's only the *resting* state below that stays border-light/fill-white. */
  .pill-group .pill.opt-discuss:hover{background:#cfe0fd;border-color:#2563eb;}

  /* default (unanswered) colors — outline + soft fill per option */
  .pill.opt-not_interested{border-color:#d64545;background:#fdecea;color:#b3261e;}
  .pill.opt-neutral{border-color:#e0900a;background:#fff6d9;color:#9a6400;}
  .pill.opt-definitely{border-color:var(--platter);background:var(--platter-bg);color:var(--platter);}
  /* Skip/discuss stays plain white/unfilled at rest (only its text reads blue), with the same
     grey stroke (var(--line)) the other pills switch to once one in the row is selected. The
     blue border+fill only show up on hover, above. */
  .pill.opt-discuss{border-color:var(--line);background:#ffffff;color:#1d4ed8;}

  /* once an item has an answer, the chosen pill goes solid dark grey... */
  .pill-group .pill.selected{
    background:#222222 !important;border-color:#222222 !important;color:#ffffff !important;
  }
  .pill-group .pill.selected:hover{background:#333333 !important;border-color:#333333 !important;}

  /* ...and every *other* option in that row goes quiet/grayscale... */
  .pill-group.answered .pill:not(.selected){
    border-color:var(--line);background:#f7f5f8;color:var(--muted);
  }
  /* ...until hovered, which brings back that option's real color as a "you could switch" hint */
  .pill-group.answered .pill.opt-not_interested:not(.selected):hover{border-color:#d64545;background:#fdecea;color:#b3261e;}
  .pill-group.answered .pill.opt-neutral:not(.selected):hover{border-color:#e0900a;background:#fff6d9;color:#9a6400;}
  .pill-group.answered .pill.opt-definitely:not(.selected):hover{border-color:var(--platter);background:var(--platter-bg);color:var(--platter);}
  .pill-group.answered .pill.opt-discuss:not(.selected):hover{border-color:#2563eb;background:#e8f0fe;color:#1d4ed8;}
  /* "N of 49 rated" text, the progress track, and the hint toggle all sit on one row, vertically
     centered. The track is the only flexible item (flex:1) so it fills whatever width is left
     between the text on the left and the button on the right.
     The bar now lives inside the items .card (rather than as a free sibling between cards), so
     its sticky range is scoped to that card — it stops sticking once you've scrolled past the
     item list, instead of floating over the whole page indefinitely. It's also hidden until the
     page is actually scrolled (see .scrolled below / the syncProgressBarScrollState() JS), so it
     doesn't just sit there redundantly while the top of the card — name field and all — is still
     fully in view. */
  /* the bar now also cancels the card's 20px *top* padding (not just its sides), and picks up
     the card's own corner radius on just its top two corners, so the gradient fills all the way
     into that curved corner instead of leaving a sliver of plain white card showing above it. */
  .progress-wrap{
    position:sticky;top:0;z-index:5;
    background:linear-gradient(135deg,#7c4dff,#c86dd7);
    border-radius:var(--radius) var(--radius) 0 0;padding:10px 16px;margin:-20px -20px 16px -20px;
    display:flex;align-items:center;gap:12px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .18s ease;
  }
  .progress-wrap.scrolled{opacity:1;visibility:visible;pointer-events:auto;}
  /* fix-errors mode's version of the same sticky bar: just a live count + an exit button, no
     track between them (nothing to fill that middle space), so space-between takes over from
     the normal layout's flex:1 track. Reuses .hint-toggle-btn purely for its white-on-gradient
     ghost-button contrast, not because the exit control is a hint toggle.
     Unlike the normal progress bar (redundant with the name field still in view, so it's fine
     to hide until scrolled), this bar's count + exit button are the primary UI for the mode --
     they need to be visible the instant the mode is entered, so it overrides the scroll-reveal
     opacity/visibility instead of inheriting it. */
  /* fix-errors mode gets its own gradient (yellow -> orange -> dark red, left to right) instead
     of the normal purple/pink one, so the sticky bar itself signals "different mode, needs
     attention" at a glance. This single bar now carries everything the mode needs -- emoji,
     "N uncompleted items" label, and the exit control -- reusing .accordion-header-label/-right
     for that inner layout (rather than the .accordion-header class itself, which brings its own
     background/border/padding that would fight this bar's sticky/gradient one) so it still reads
     as a sibling to "Things you already rated" below it. The deeper goldenrod start (vs. a
     brighter lemon yellow) is deliberate -- too close to the warning emoji's own yellow and the
     two blend together; the drop-shadow on the emoji below adds further separation. Black text
     on it clears ~9:1 contrast at that first stop, so no chip is needed -- but the title's right
     edge can drift well into the orange/red portion at narrow widths with a long count (e.g. "50
     uncompleted items" at 320px lands ~77% across the bar), so the orange and red stops are both
     lightened a step from a plain "looks good on its own" orange/red -- the worst-case position
     still clears ~5.6:1 with room for font-rendering variance, instead of dipping to ~4.45:1
     (just under WCAG AA's 4.5:1) with the more saturated originals. */
  .fix-errors-bar{
    justify-content:space-between;opacity:1;visibility:visible;pointer-events:auto;
    background:linear-gradient(90deg,#d9a017,#f08c1a,#d32f2f);
  }
  /* the bar doesn't carry the .accordion-header class itself (see comment above), so it misses
     that class's own .emoji size override -- match it explicitly rather than falling back to
     the much larger 2.5rem app-wide default, and center the label's own align-items (its shared
     default is flex-start, for hanging-indent wrap on long titles) since a same-size emoji and
     single-line title should sit on the same visual center, not top-align. */
  .fix-errors-bar .emoji{font-size:1.75rem;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.45));}
  .fix-errors-bar .accordion-header-label{align-items:center;}
  .fix-errors-title{color:#000;font-weight:700;font-size:1.02rem;}
  .fix-errors-title .title-short{display:none;}
  .fix-errors-bar .hint-toggle-btn.btn.ghost{background:rgba(0,0,0,0.5);}
  .fix-errors-bar .hint-toggle-btn.btn.ghost:hover{background:rgba(0,0,0,0.62);}
  /* icon-only exit button once the bar gets tight -- same breakpoint the rest of the quiz's
     mobile pass uses (category-title/item-label/etc, see below), so it lines up with when those
     other elements start growing and eating the sticky bar's available width. */
  @media (max-width:700px){
    .fix-errors-exit-btn .exit-label{display:none;}
    /* icon-only needs its own square-and-round treatment -- the button's normal padding is
       asymmetric (7px 12px, tuned for the wider text label), which with only the "✕" glyph left
       reads as an oval rather than a circle. */
    .fix-errors-exit-btn{
      width:36px;height:36px;padding:0;
      display:inline-flex;align-items:center;justify-content:center;
    }
    /* shorter count phrasing once the exit button drops its label too -- "N uncompleted items"
       is the longest string this bar ever shows (worst case "50 uncompleted items"), and at
       narrow widths that's what was pushing the title into a two-line wrap. */
    .fix-errors-title .title-full{display:none;}
    .fix-errors-title .title-short{display:inline;}
  }
  .progress-text{font-size:0.82rem;color:#fff;flex-shrink:0;white-space:nowrap;}
  .progress-track{flex:1 1 auto;height:8px;background:rgba(255,255,255,0.35);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:#fff;border-radius:6px;transition:width .2s ease;}
  .hint-toggle-btn{flex-shrink:0;}
  /* Borderless pill instead of the default .btn.ghost outline -- a dark, fully-opaque-looking
     fill (not the border) is what carries the contrast against the sticky bar's gradient here,
     so the outline was redundant on top of it. */
  .hint-toggle-btn.btn.ghost{
    border:none;border-radius:999px;color:#fff;background:rgba(0,0,0,0.32);
  }
  .hint-toggle-btn.btn.ghost:hover{background:rgba(0,0,0,0.45);}
  /* the app-wide 2.5rem .emoji default was stretching this button 10px taller than Home/Start
     Over next to it (same issue as the old Print a PDF button) -- sized to sit inline with the
     button's own text instead, like the print button's icon now does. */
  .hint-toggle-btn .emoji{font-size:1rem;line-height:1;}
  /* ---- home tile status lines (no pill background — just a dot + text) ----
     .status-dot is a plain outlined circle; .status-half fills its left half via a hard-stop
     gradient (currentColor / transparent), .status-full fills the whole circle solid. */
  .status-line{display:inline-flex;align-items:center;gap:7px;font-size:0.82rem;font-weight:700;letter-spacing:.02em;}
  .status-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box;flex-shrink:0;display:inline-block;}
  .status-dot.status-half{background:linear-gradient(to right, currentColor 50%, transparent 50%);}
  .status-dot.status-full{background:currentColor;}
  .tile .status-line.in-progress{color:#f0a868;}
  .tile .status-line.saved{color:#7fd9a0;}
  .section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:default;}
  .section-header .count{background:#f0e8fb;color:var(--accent-dark);font-size:0.78rem;font-weight:700;padding:2px 9px;border-radius:20px;}
  /* flat list rows instead of individually-boxed cards -- no radius, no left/right border, just a
     horizontal divider between items (mirrors .item-row's pattern on the rating screen) */
  .result-item{
    border:none;border-radius:0;border-bottom:1px solid var(--line);
    padding:14px 2px;margin-bottom:0;background:transparent;
  }
  .result-item:last-child{border-bottom:none;}
  .result-item.removed-item{opacity:0.85;}
  .result-item.favorited{background:#fffaf0;}
  /* wrap-reverse (not wrap): when .favorite-control doesn't fit next to .result-item-main on
     one line, this puts its wrapped line ABOVE the main-content line instead of below --
     flex-wrap only reverses which line comes first, not the left-to-right order within a
     line, so the wide-width case (both fit on one line) renders identically either way. This
     way the star/priority badge always lands at the top of the item whenever it wraps, for
     every row, without a fixed-width media query forcing the stack on rows that still fit. */
  .result-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap-reverse;}
  .result-item-main{flex:1 1 220px;}
  .result-item-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .flag-note{font-size:0.82rem;color:var(--muted);margin-top:4px;}
  .ratings-detail{font-size:0.78rem;color:var(--muted);margin-top:4px;line-height:1.6;}
  .item-category-tag{font-family:'Arimo',Arial,sans-serif;font-size:0.72rem;color:var(--accent-dark);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}

  /* ---- favorite / "Very important" star toggle ---- */
  .favorites-block{margin-bottom:18px;}
  .favorite-control{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .very-important-label{
    font-size:0.72rem;font-weight:700;color:#b45309;background:#fff4e2;
    padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  /* star colors darkened from the original #c9c2d1/#e0900a/#f2a900 -- against the white card
     background those measured ~1.7:1 / ~2.6:1 / ~2.0:1, all short of the 3:1 minimum for a
     graphical/icon-only control that conveys its favorited state through color alone. */
  .star-btn{
    background:none;border:none;cursor:pointer;font-size:1.4rem;line-height:1;
    color:#8f8898;padding:2px;transition:color .12s ease, transform .12s ease;
  }
  .star-btn:hover{color:#a37a08;transform:scale(1.15);}
  .star-btn.active{color:#8f6c07;}

  /* ---- results-page accordion sections (Platter / Discuss / Misaligned-or-double-neutrals / Removed) ---- */
  .results-accordion{margin-bottom:16px;}
  .accordion-header{
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:16px 20px;background:rgba(255,255,255,0.74);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1.5px solid rgba(255,255,255,0.6);border-radius:12px;font-weight:700;font-size:1.02rem;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  /* the count + chevron live in their own flex-shrink:0 group on the right so they never get
     dragged into the title's text flow -- previously they sat inline after the title inside one
     div, so a long title wrapping at narrow widths could wrap the count along with it instead of
     leaving it pinned next to the arrow. min-width:0 on the label lets the title actually wrap
     within its own column (a flex-item quirk: without it, flex items refuse to shrink below
     their content's natural width); align-items:flex-start plus the emoji/title being separate
     flex items (rather than inline text) gives wrapped title lines a hanging indent -- they stay
     in the title's column to the right of the emoji instead of wrapping back under it. */
  .accordion-header-label{display:flex;align-items:flex-start;gap:8px;min-width:0;}
  .accordion-header-label .emoji{flex-shrink:0;}
  .accordion-header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .accordion-header .count{background:#f0e8fb;color:var(--accent-dark);font-size:0.78rem;font-weight:700;padding:2px 9px;border-radius:20px;}
  /* open = darker background, so it's obvious at a glance which sections are expanded */
  .accordion-header.open{
    background:#2b2530;border-color:#2b2530;color:#fff;
    border-bottom-left-radius:0;border-bottom-right-radius:0;
  }
  .accordion-body{
    padding:18px 18px 4px;border:1.5px solid rgba(255,255,255,0.6);border-top:none;border-radius:0 0 12px 12px;
    background:rgba(255,255,255,0.74);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  }
  .accordion-body.collapsed{display:none;}
  .chevron{transition:transform .15s ease;}
  .chevron.open{transform:rotate(180deg);}
  .empty-state{text-align:center;padding:26px 10px;color:var(--muted);font-size:0.92rem;}

  /* ---- "Add an item" footer section ---- */
  .add-item-footer{
    background:linear-gradient(135deg,#f4ecfd,#ece0fa);
    border:1.5px solid #d9bdf2;border-radius:16px;padding:24px;margin-top:8px;margin-bottom:18px;
  }
  .file-drop{
    border:2px dashed #d9cbe8;border-radius:12px;padding:26px;text-align:center;background:#fbf9fe;cursor:pointer;
    transition:border-color .12s ease,background .12s ease;
  }
  .file-drop:hover{border-color:var(--accent);}
  .file-drop.dragover{border-color:var(--accent);background:#f4effd;border-style:solid;}
  .loaded-file{
    display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
    background:#f8f5fa;border-radius:10px;margin-bottom:8px;font-size:0.9rem;
  }
  .home-tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
  @media (max-width:640px){.home-tiles{grid-template-columns:1fr;}}
  /* dark counterpart to .card's light glass treatment (see the comment there), with alpha added
     to each stop so backdrop-filter can pull the animated blobs through it, blurred. The stops
     lean into --accent's own hue (~256°) at meaningfully higher saturation than a flat near-black
     would give -- the original near-desaturated gray-purple read as washed out once the glass
     blur/saturate filter was layered on top. 0.85 alpha (higher than .card's 0.74) is deliberate
     -- the backdrop here is always some light pastel blob tint, so a *dark* glass panel needs more
     opacity to resist being pulled lighter by it, whereas a light glass panel over the same
     backdrop barely shifts. Worst-case composite against a near-white backdrop still measures
     ~8.7:1 for the white text on top, comfortably clearing WCAG AA's 4.5:1 minimum. */
  .tile{
    border:1.5px solid #4f2f7a;border-radius:16px;padding:22px;cursor:default;
    background:linear-gradient(135deg,rgba(65,28,110,0.85),rgba(24,10,42,0.85));
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    color:#f5f0fa;
    box-shadow:0 2px 10px rgba(30,10,40,0.18);text-align:left;
    display:flex;flex-direction:column;
  }
  /* shared sizing for standalone decorative emoji glyphs throughout the app */
  .emoji{font-size:2.5rem;line-height:1;vertical-align:middle;}
  .tile .tile-emoji{font-size:2.5rem;margin-bottom:8px;display:block;}
  /* accordion section icons run smaller than the 2.5rem app-wide default so they don't
     overwhelm their inline labels */
  .accordion-header .emoji{font-size:1.75rem;}
  /* the print button's icon sits inline with regular button text (unlike the accordion/tile
     emoji above, which stand alone) -- sized to match that text instead of the oversized
     app-wide default, so it fits inside the button instead of stretching it taller. */
  [data-action="print-certificate"] .emoji{font-size:1rem;line-height:1;}
  .tile h3{color:#ffffff;}
  /* matches .hero-title's size/weight exactly (both breakpoints, below) rather than its own
     fixed size -- Agu Display only ships the one (regular) weight, so font-weight:400 is
     already as light as it gets; it was only *reading* bolder here because a display face's
     thin strokes look chunkier the smaller it's set, not because of an actual heavier weight.
     display:block + an explicit margin-bottom (rather than the inline span + <br> this used to
     be) guarantees clearance below it: Agu Display's own baked-in ascent/descent metrics run
     tall enough that even a generous CSS line-height wasn't enough gap on its own -- the text
     right after it (step-title, below) was visually colliding with its descenders. */
  .tile h3 .step-label{
    display:block;font-family:'Agu Display','Arimo',Arial,sans-serif;font-variation-settings:"MORF" 30;
    font-size:3.4rem;font-weight:400;letter-spacing:0.05em;line-height:1.1;margin:0 0 10px;
  }
  /* matches the "What this is" card heading's size (h2, 1.25rem) rather than the ~0.85rem it
     inherited from the shared h3 default. */
  .tile h3 .step-title{display:block;font-size:1.25rem;}
  .tile .muted{color:#c9bcd6;}
  .tile-actions{display:flex;flex-wrap:wrap;gap:8px;}
  /* The flexible (auto) space lives between the paragraph copy and whatever comes right after
     it — the status line, if one is showing, otherwise the button row directly. Since
     .home-tiles is a grid, both tiles stretch to the same height, so that single auto margin
     always expands to fill 100% of the tile's remaining space. That means the status line (and
     the buttons below it) land at the exact same fixed distance from the *bottom* of the tile in
     both cards, so they line up across tiles regardless of how much description copy is above.
     padding-top is a minimum-gap fallback for when there's no extra space to expand into, e.g.
     the single-column mobile layout where each tile is only as tall as its own content. */
  .tile p.muted + .tile-actions{margin-top:auto;padding-top:14px;}
  .tile p.muted + .status-line{margin-top:auto;padding-top:14px;}
  /* Fixed gap from the status line down to the buttons: exactly 2x the gap between the primary
     and secondary buttons themselves (.tile-actions gap:8px above, so 16px here). */
  .status-line + .tile-actions{margin-top:16px;}
  /* primary ("Continue from last auto-save" / "Start ...") buttons inside a tile flip to
     white-on-purple instead of the site-wide solid-accent-purple .btn -- against this tile's
     now noticeably more saturated purple glass, a purple button on purple read as low-contrast
     and blended-in rather than a clear call to action. Secondary/ghost buttons are untouched,
     per the ask. */
  .tile .btn:not(.ghost){background:#fff;color:var(--accent-dark);}
  .tile .btn:not(.ghost):hover{background:#f4effd;}
  .tile .btn.ghost{color:#f0e9f7;border:1.5px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.07);}
  .tile .btn.ghost:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.55);}
  /* ghost buttons inside a tile match the size of the primary button next to them */
  .tile-actions .btn.ghost{padding:11px 18px;font-size:0.95rem;border-radius:10px;}
  .footer-note{text-align:center;color:var(--muted);font-size:0.8rem;margin-top:30px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#2b2530;color:#fff;padding:11px 20px;border-radius:10px;font-size:0.88rem;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}
  /* results-page celebration card: title, then participant names in the same display face as
     "Let's Make A Smorgasbord", then actions -- each on its own line, centered at every
     breakpoint (unlike the header above, which stays left-aligned). Background reuses the same
     gradient as the quiz's progress bar (.progress-wrap), so this card reads as the same
     "you did it" color note landing on the results page. Text and buttons flip to white/
     translucent-white on top of it, the same way .tile already does for its own dark background. */
  .results-hero{
    text-align:center;color:#fff;
    background:linear-gradient(135deg,#7c4dff,#c86dd7);border-color:transparent;
  }
  .results-hero-title{margin:0 0 6px;color:#fff;}
  .results-hero-names{
    font-family:'Agu Display','Arimo',Arial,sans-serif;font-variation-settings:"MORF" 30;
    font-size:3rem;line-height:1.15;letter-spacing:0.05em;font-weight:400;
    color:#fff;margin:0 0 18px;
    /* no white-space:nowrap: fitResultsNames() sizes this to fit on one line for any
       reasonably-short name combo, but a pathologically long one can still hit the JS
       floor (MIN_PX) below the width it needs -- wrapping to a 2nd line there beats
       running off the edge of the card/viewport. */
  }
  .results-hero-actions{justify-content:center;}
  /* white text on a *lightly* translucent white fill (as tried initially) measures under 3:1
     against this gradient -- white-on-tinted-white is low-contrast almost by construction,
     however see-through. A near-opaque white pill with dark accent text instead clears the
     WCAG AA 4.5:1 text minimum comfortably (~7.7:1 against the gradient's lighter end) while
     still reading as a translucent chip sitting on top of the gradient, not a flat card. */
  .results-hero-actions .btn{
    background:rgba(255,255,255,0.92);color:var(--accent-dark);border:1.5px solid rgba(255,255,255,0.95);
  }
  .results-hero-actions .btn:hover{background:#ffffff;}
  hr.divider{border:none;border-top:1px solid var(--line);margin:22px 0;}
  .instructions ol{padding-left:20px;margin:0;}
  .instructions ul{padding-left:20px;margin:0;}
  .instructions li{margin-bottom:6px;}
  .phone-tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
  @media (max-width:640px){.phone-tips-grid{grid-template-columns:1fr;}}
  .phone-tip-card{border:1.5px solid var(--line);border-radius:12px;padding:16px;background:#faf8fb;}
  .phone-tip-card h3{color:var(--accent-dark);margin-bottom:8px;}
  .phone-tip-card ol{padding-left:20px;margin:0;}
  .phone-tip-card li{margin-bottom:6px;font-size:0.92rem;}
  .add-item-form{display:grid;gap:12px;margin-top:6px;}
  textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:0.95rem;resize:vertical;min-height:60px;}

  /* ============================= PRINTABLE PLAQUE ============================= */
  /* On screen, the certificate markup exists in the DOM but stays hidden; it only becomes
     visible (and everything else hides) when the browser's print dialog is invoked, which is
     how the "Print Plaque" button produces a Save-as-PDF-ready page without a server or a
     PDF library. */
  .print-only{display:none;}
  /* #print-certificate is a direct sibling of the rest of the results page's content inside
     #app (topBar, cards, every accordion/item row) -- not a descendant of it. visibility:hidden
     alone leaves all of that other content still occupying its normal (tall) layout height, just
     invisibly, so the print engine paginated across that whole hidden height: one real page for
     the absolutely-positioned certificate, then several blank pages for the empty space below it.
     display:none actually removes the other content from layout instead of just hiding it, so
     the printed document is only as tall as the certificate itself. */
  @media print{
    #app > *:not(#print-certificate){display:none !important;}
    #app{padding:0;max-width:none;margin:0;}
    #print-certificate{display:block !important;margin:0;padding:0;}
    @page{size:8.5in 11in;margin:0.4in;}
  }
  .cert-border{border:3px double #8a6d2f;padding:14px;}
  .cert-inner{
    border:1px solid #c9a95c;padding:0.5in 0.5in 0.4in;text-align:center;background:#fdfaf3;
    display:flex;flex-direction:column;align-items:center;min-height:9.8in;box-sizing:border-box;
  }

function filenameTimestamp(d){
  d = d || new Date();
  const pad = n => String(n).padStart(2,"0");
  const yyyy = d.getFullYear();
  const mm = pad(d.getMonth()+1);
  const dd = pad(d.getDate());
  const hh = pad(d.getHours());
  const min = pad(d.getMinutes());
  const ss = pad(d.getSeconds());
  return `${yyyy}-${mm}-${dd}_${hh}-${min}-${ss}`;
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function withScrollPreserved(fn){

}

/* Measures how wide `text` would render in `el`'s current font (family/weight/style/letter-
   spacing/variation-settings, at its current font-size) via an off-screen probe span, since
   CSS alone can't target a single word or string's actual rendered width -- only the whole
   element's box. Shared by fitHeroTitle and fitResultsNames below, which each scale a
   different element's font-size off of this measurement. */
function measureTextWidth(el, text){
  const cs = getComputedStyle(el);
  const probe = document.createElement("span");
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  probe.style.whiteSpace = "nowrap";
  probe.style.left = "-9999px";
  probe.style.fontFamily = cs.fontFamily;
  probe.style.fontWeight = cs.fontWeight;
  probe.style.fontStyle = cs.fontStyle;
  probe.style.letterSpacing = cs.letterSpacing;
  probe.style.fontVariationSettings = cs.fontVariationSettings;
  probe.style.fontSize = cs.fontSize;
  probe.textContent = text;
  document.body.appendChild(probe);
  const width = probe.offsetWidth;
  probe.remove();
  return { width, baseFontPx: parseFloat(cs.fontSize) };
}

/* Below 700px there's no single font-size that both fills the width and never overflows --
   the container keeps shrinking while "Smorgasbord" (the one word that can't wrap) stays a
   fixed number of characters. This measures "Smorgasbord" against the live font metrics and
   scales the headline to the largest size that still fits on one line. */
function fitHeroTitle(){
  const el = document.querySelector(".hero-title");
  if(!el) return;
  const isNarrow = window.matchMedia("(max-width:700px)").matches;
  if(!isNarrow){ el.style.fontSize = ""; return; }
  el.style.fontSize = "";
  const containerWidth = el.clientWidth;
  if(containerWidth <= 0) return;
  const { width: wordWidth, baseFontPx } = measureTextWidth(el, "Smorgasbord");
  if(!wordWidth) return;
  const MIN_PX = 30, MAX_PX = 3.4*16; // legible floor; never larger than the desktop size
  const targetPx = Math.max(MIN_PX, Math.min(MAX_PX, baseFontPx*(containerWidth/wordWidth)*0.96));
  el.style.fontSize = targetPx+"px";
}

/* Participant names on the results celebration card: always kept to one line (never wrapped
   or broken) and scaled to fill the card's width at every breakpoint, the same way the hero
   title above fills its width on narrow screens -- just without the narrow-only gate, since
   this element only ever appears inside a card (not a full-width hero) so it has room to
   shrink or grow at any viewport size. */
function fitResultsNames(){
  const el = document.querySelector(".results-hero-names");
  if(!el) return;
  el.style.fontSize = "";
  const containerWidth = el.clientWidth;
  if(containerWidth <= 0) return;
  const { width: textWidth, baseFontPx } = measureTextWidth(el, el.textContent);
  if(!textWidth) return;
  const MIN_PX = 22, MAX_PX = 3.5*16;
  const targetPx = Math.max(MIN_PX, Math.min(MAX_PX, baseFontPx*(containerWidth/textWidth)*0.94));
  el.style.fontSize = targetPx+"px";
}

/* ============================= RATE VIEW ============================= */
function ensureRatingState(){
  if(!state.rating || state.rating.submitted){
    state.rating = { name:"", ratings:{} };
  }
}
// Transient UI-only flag (not persisted -- a fresh page load always starts back in the normal
// view, same as nameFieldError/sectionOpen below). Entered by clicking "I'm done!" while
// incomplete (see exportRatings()); renderRate() checks it first thing and clears it again on
// its own the moment nothing's left to fix, so there's no separate "auto-exit" code path to
// keep in sync -- completion is just re-evaluated on every render like everything else here.
let fixErrorsMode = false;
// Transient UI-only flag (not persisted, like sectionOpen below) -- set when Save/Export is
// attempted with no name entered, cleared as soon as the user starts typing one. renderRate()
// reads it too, so the error survives a full re-render (e.g. toggling hints) instead of only
// existing as a one-off DOM patch from showNameFieldError().
let nameFieldError = false;
function showNameFieldError(){
  nameFieldError = true;
  const input = document.getElementById("rater-name");
  const err = document.getElementById("name-field-error");
  if(input) input.classList.add("input-error");
  if(err) err.classList.add("show");
  if(input) input.focus();
}
function clearNameFieldError(){
  if(!nameFieldError) return;
  nameFieldError = false;
  const input = document.getElementById("rater-name");
  const err = document.getElementById("name-field-error");
  if(input) input.classList.remove("input-error");
  if(err) err.classList.remove("show");
}
// total/answered fold the name field in as one more thing to complete (49 items + the name =
// 50), so the progress bar/toasts read as "how much of this form is done" rather than just
// "how many items are rated" -- itemsTotal/itemsAnswered/nameSet stay available separately for
// logic that specifically needs item-only completion (the disabled-export hint below).
function ratingProgress(){
  const itemsTotal = ALL_ITEMS.length;
  const itemsAnswered = Object.keys(state.rating.ratings).length;
  const nameSet = !!state.rating.name;
  return {
    itemsTotal, itemsAnswered, nameSet,
    total: itemsTotal + 1,
    answered: itemsAnswered + (nameSet ? 1 : 0)
  };
}

/* Single source of truth for the two bottom-of-quiz action buttons' label/disabled state,
   used both for the initial render (renderRate(), below) and for the two places that patch
   these buttons directly instead of re-rendering (nameInput.oninput and handleRateClick, in
   attachGlobalHandlers/handleRateClick) -- those exist specifically to avoid losing text-input
   focus / scroll position on a full re-render, so they need this same logic kept in sync
   rather than duplicated inline.
   Save-progress is always the outline (secondary) button, enabled as soon as anything at all
   is filled in -- any single item rated, or just the name typed -- since there's something
   worth saving at that point; it only stays disabled at the very start, before any of the 50
   things (49 items + name) has been touched.
   Save-results is always the solid button and is never given the disabled attribute -- click
   it while incomplete and exportRatings() (below) sends you into fix-errors mode instead of
   exporting, so it has to stay genuinely clickable. It keeps the same muted look while
   incomplete via a class (.pending, styled below) instead of :disabled, and drops that class
   for the fully opaque look once every item's rated and a name is set. */
function finalActionButtonState(){
  const { total, answered } = ratingProgress();
  const isComplete = answered===total; // total/answered already fold the name in, see ratingProgress()
  return {
    saveDisabled: answered===0,
    saveClass: "btn secondary",
    saveLabel: isComplete ? "Save" : "Save my progress, I'll come back",
    exportClass: isComplete ? "btn" : "btn pending",
    exportLabel: isComplete ? "Save my results" : "I'm done! Download my answers"
  };
}
function syncFinalActionButtons(){
  const s = finalActionButtonState();
  const saveBtn = document.getElementById("save-progress-btn");
  if(saveBtn){ saveBtn.disabled = s.saveDisabled; saveBtn.className = s.saveClass; saveBtn.textContent = s.saveLabel; }
  const exportBtn = document.getElementById("export-ratings-btn");
  if(exportBtn){ exportBtn.className = s.exportClass; exportBtn.textContent = s.exportLabel; }
}

// Shared by both the normal full list and fix-errors mode's two collections below, so there's
// one implementation of what a rating row looks like instead of two copies that could drift.
// showCategoryTag is only true in fix-errors mode's "still needed" list, where items are
// pulled out of their category's block and lose that context otherwise.
function renderRateItemRow(item, showHints, showCategoryTag){
  const current = state.rating.ratings[item.id];
  const isAnswered = !!current;
  const itemHint = ITEM_HINTS[item.id];
  const renderPill = (opt)=>`
    <div class="pill opt-${opt.value} ${current===opt.value?'selected':''}"
         data-action="rate-item" data-item="${item.id}" data-value="${opt.value}">${esc(opt.label)}</div>`;
  return `
  <div class="item-row">
    <div>
      ${showCategoryTag ? `<div class="item-category-tag">${esc(item.category)}</div>` : ""}
      <div class="item-label">${esc(item.label)}</div>
      ${showHints && itemHint ? `<div class="item-hint">${esc(itemHint)}</div>` : ""}
    </div>
    <div class="pill-group ${isAnswered?'answered':''}" data-item="${item.id}">
      ${RATING_OPTIONS.map(opt=>renderPill(opt)).join("")}
    </div>
  </div>`;
}

function renderRate(){
  ensureRatingState();
  const { total, answered, nameSet } = ratingProgress();
  const isComplete = answered===total;
  // Re-checked on every render rather than tracked as a separate "should I exit" step -- the
  // moment nothing's left to fix, this just falls back to the normal (now-complete) view.
  if(fixErrorsMode && isComplete) fixErrorsMode = false;
  const pct = Math.round((answered/total)*100);
  const fab = finalActionButtonState();
  const showHints = fixErrorsMode ? true : !!state.showHints;

  const nameFieldHtml = `
    <input type="text" id="rater-name" class="${nameFieldError ? 'input-error' : ''}" placeholder="e.g. Alex" value="${esc(state.rating.name)}" data-action="set-name">

  let itemsCardHtml;
  if(fixErrorsMode){
    const thingsLeft = total - answered;
    // "still needed" -- the name field (if empty) plus every unrated item, pulled together
    // regardless of which category they came from, per the ask: "whether it's a name or
    // something to rate."
    let neededHtml = "";
    if(!nameSet){
      neededHtml += `
      <div class="item-row">
        <div><label class="field-label" for="rater-name">Your name <span class="field-label-note">(shown to your partner(s) in the results)</span></label></div>

      </div>`;
    }
    ALL_ITEMS.forEach(item=>{
      if(!state.rating.ratings[item.id]) neededHtml += renderRateItemRow(item, true, true);

    // "already rated" -- everything answered, grouped by category same as the normal list,
    // tucked into one collapsed accordion (reusing the results-page accordion component) that
    // stays fully editable if opened.
    let ratedHtml = "";
    CATEGORIES.forEach(cat=>{
      const catSlug = slugify(cat.name);

        .map(label=>({ id: catSlug+"__"+slugify(label), category: cat.name, label }))

      if(!answeredInCat.length) return;
      ratedHtml += `<div class="category-block"><div class="category-title">${esc(cat.name)}</div>`;
      answeredInCat.forEach(item=> ratedHtml += renderRateItemRow(item, false, false));
      ratedHtml += `</div>`;
    });
    itemsCardHtml = `
    <div class="card">
      <div class="progress-wrap fix-errors-bar">

  } else {
    let itemsHtml = "";
    CATEGORIES.forEach(cat=>{
      const catSlug = slugify(cat.name);
      itemsHtml += `<div class="category-block">`;
      if(showHints && cat.desc){
        itemsHtml += `<div class="category-header with-hint">
          <div class="category-title">${esc(cat.name)}</div>
          <div class="category-desc">${esc(cat.desc)}</div>
        </div>`;
      } else {
        itemsHtml += `<div class="category-title">${esc(cat.name)}</div>`;
      }
      cat.items.forEach(label=>{
        const item = { id: catSlug+"__"+slugify(label), category: cat.name, label };
        itemsHtml += renderRateItemRow(item, showHints, false);
      });
      itemsHtml += `</div>`;
    });
    itemsCardHtml = `
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-text" id="progress-text">${answered} of ${total}</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:${pct}%;"></div></div>
        <button class="btn ghost small hint-toggle-btn" data-action="toggle-hints">${showHints ? '<span class="emoji">\u{1F4A1}</span> Hide hints' : '<span class="emoji">\u{1F4A1}</span> Show hints'}</button>
      </div>

  }

  return `
  ${topBar('Private rating — your partner cannot see this screen or your answers here. Later, on the compiled results screen, you and your partner(s) will see items everyone rated "Def want this" or "Skip — discuss later," plus a list of "Neutral" items. Your "Not interested" answers are never shown to anyone else.')}

  ${itemsCardHtml}

  <div class="card final-actions-grid">
    <div class="final-actions-col">
      <div class="muted final-actions-copy">
        Not done? Click <strong>${fab.saveLabel}</strong> any time — it downloads a small file you can re-import

      </div>

/* ============================= MERGE LOGIC ============================= */
function newEmptySession(){
  return { type:"smorgasbord-session", version:1, participants:[], items:{}, customCounter:0, createdAt: new Date().toISOString(), lastUpdated: new Date().toISOString() };
}

function computeAutoStatus(ratingsByParticipant){
  const entries = Object.entries(ratingsByParticipant);
  if(entries.length===0) return { status:"parked", reason:"unrated" };
  const discussers = entries.filter(([,v])=>v==="discuss").map(([n])=>n);
  if(discussers.length>0) return { status:"discuss", reason:"flagged", by: discussers };
  const values = entries.map(([,v])=>v);
  if(values.every(v=>v==="definitely")) return { status:"platter", reason:"unanimous" };
  // If everyone who rated this said "Not Interested," it never surfaces anywhere —
  // that answer stays private and the item is simply left off the results page.
  if(values.every(v=>v==="not_interested")) return { status:"hidden", reason:"unanimous-not-interested" };
  const hasDef = values.some(v=>v==="definitely");
  const hasNo = values.some(v=>v==="not_interested");
  // Someone wants it, someone doesn't — worth a conversation, but we never reveal
  // *who* said "Not Interested" or that that option was even chosen.
  if(hasDef && hasNo) return { status:"discuss", reason:"conflict" };
  return { status:"parked", reason:"low-interest" };
}

function mergeRatingsFileIntoSession(session, ratingsFile){
  if(!session.participants.includes(ratingsFile.participant)){
    session.participants.push(ratingsFile.participant);
  }
  ALL_ITEMS.forEach(item=>{
    if(!session.items[item.id]){
      session.items[item.id] = {
        category: item.category, label: item.label,
        ratingsByParticipant: {}, status:"parked", movedManually:false, isCustom:false
      };
    }
    const val = ratingsFile.ratings[item.id];
    if(val){
      session.items[item.id].ratingsByParticipant[ratingsFile.participant] = val;
    }
  });
  recomputeAllStatuses(session);
  session.lastUpdated = new Date().toISOString();
}

function recomputeAllStatuses(session){
  Object.values(session.items).forEach(it=>{
    if(it.movedManually || it.isCustom) return;
    const r = computeAutoStatus(it.ratingsByParticipant);
    it.status = r.status;
    it.statusReason = r.reason;
    it.flaggedBy = r.by || [];
  });
}

/* ============================= COMBINE ACTIONS ============================= */
function handleFilesSelected(fileList, onDone){
  const files = Array.from(fileList);
  let remaining = files.length;
  if(remaining===0) return;
  files.forEach(f=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(data.type === "smorgasbord-ratings"){
          state.loadedFiles.push({
            type:"ratings", participant:data.participant, timestamp:new Date().toLocaleString(), raw:data
          });
        } else if(data.type === "smorgasbord-session"){
          state.loadedFiles.push({
            type:"session", participants:data.participants, timestamp:new Date().toLocaleString(), raw:data
          });
        } else {
          showToast("Unrecognized file: "+f.name);
        }
      }catch(err){
        showToast("Couldn't read "+f.name);
      }
      remaining--;
      if(remaining===0){
        persist();
        if(onDone) onDone(); else render();
      }
    };
    reader.readAsText(f);
  });
}

// Home's "Load a saved session file" shortcut: if a full session file is loaded, jump straight
// into the results view (mirroring how loading a rating-progress file jumps straight into
// Rate). If only ratings files come in, stage them on the Combine screen for merging instead.
function handleHomeSessionFileSelected(fileList){
  handleFilesSelected(fileList, function(){
    const hasSessionFile = state.loadedFiles.some(f=>f.type==="session");
    if(hasSessionFile){
      buildResultsFromLoadedFiles();
    } else if(state.loadedFiles.length){
      state.view = "combine";
      persist();
      render();
    } else {
      render();
    }
  });
}

function buildResultsFromLoadedFiles(){
  let session = state.session || newEmptySession();
  // Apply session files first (as base), then ratings files (as updates)
  state.loadedFiles.filter(f=>f.type==="session").forEach(f=>{
    session = f.raw;
  });
  state.loadedFiles.filter(f=>f.type==="ratings").forEach(f=>{
    mergeRatingsFileIntoSession(session, f.raw);
  });
  state.session = session;
  state.loadedFiles = [];
  state.view = "results";
  persist();
  render();
}

// Per-section open/closed state, shared by the results-page accordions and the rate view's
// "already rated" one (key "rated", see renderRate()) since both reuse renderAccordionSection()
// and the same generic toggle-section action handler. Platter starts open (it's the headline),
// Discuss starts closed (you open it when you're ready to talk), the rest -- including
// "rated" -- start closed/tucked away.
let sectionOpen = { platter:true, discuss:false, parked:false, removed:false, rated:false };

function groupItemsByCategory(itemEntries){
  const map = {};
  itemEntries.forEach(([id,it])=>{
    if(!map[it.category]) map[it.category] = [];
    map[it.category].push([id,it]);
  });
  return map;
}

function renderRatingsDetail(it){
  // "Not Interested" answers are never shown to anyone else — omit them entirely,
  // don't just relabel them, so no one can infer who answered that way.
  const parts = Object.entries(it.ratingsByParticipant)
    .filter(([,val])=>val!=="not_interested")
    .map(([name,val])=>{
      const opt = RATING_OPTIONS.find(o=>o.value===val);
      return `${esc(name)}: ${opt?esc(opt.label):esc(val)}`;
    });
  return parts.join("<br>");
}

// Favorited items float to the top of their section, pulled out of the normal category
// grouping so they're immediately visible without scrolling. The rest of the section still
// groups by category as usual. The heading and star label are section-specific: platter/
// removed items use the default "Top Desires" / "Priority for us" framing, but Discuss and
// Misaligned/double-neutrals get their own framing since "favoriting" means something different there
// (surfacing what to talk about first vs. what to double-check later).
const FAVORITES_BLOCK_TITLES = { discuss:"AGENDA TOPICS", parked:"FLAGGED" };
const FAVORITE_STAR_LABELS = { discuss:"Priority for discussion", parked:"Priority for review" };

function renderSectionBody(list, kind){
  const favs = list.filter(([,it])=>it.favorite);
  const rest = list.filter(([,it])=>!it.favorite);
  let html = "";
  if(favs.length){
    const blockTitle = FAVORITES_BLOCK_TITLES[kind] || "Top Desires";
    html += `<div class="favorites-block">
      <div class="category-title">${esc(blockTitle)}</div>
      ${favs.map(([id,it])=>renderResultItem(id,it,kind,{showCategory:true})).join("")}
    </div>`;
  }
  const grouped = groupItemsByCategory(rest);
  html += Object.keys(grouped).sort().map(cat=>`
    <div class="category-block">
      <div class="category-title">${esc(cat)}</div>
      ${grouped[cat].map(([id,it])=>renderResultItem(id,it,kind)).join("")}
    </div>
  `).join("");
  return html;
}

function renderAccordionSection(key, emoji, title, count, bodyHtml){
  const isOpen = !!sectionOpen[key];
  return `
  <div class="results-accordion">
    <div class="accordion-header ${isOpen?'open':''}" data-action="toggle-section" data-section="${key}">
      <div class="accordion-header-label">
        <span class="emoji">${emoji}</span>
        <span>${title}</span>
      </div>
      <div class="accordion-header-right">
        <span class="count">${count}</span>
        <span class="chevron ${isOpen?'open':''}">▼</span>
      </div>
    </div>
    <div class="accordion-body ${isOpen?'':'collapsed'}">
      ${bodyHtml}
    </div>
  </div>`;
}

// Muted, tasteful palette cycled across however many category wedges are needed — spans
// plum/lavender through gold so it stays legible and on-theme with the plaque's ink/cream look.
const CERT_WEDGE_COLORS = [
  "#e4d9f0","#d3c0e8","#c2a7df","#b18ed6",
  "#e9dab8","#ddc48f","#d1ae66","#c5983f",
  "#e6c9d6","#dab0c2","#ce97ae","#c27e9a"
];

// Breaks a long item label into multiple short lines (by word count, not real text
// measurement) so it has a fighting chance of staying inside its wedge on the printed page.
function wrapCertLabel(label, maxChars){
  const words = String(label).split(" ");
  const lines = [];
  let current = "";
  words.forEach(w=>{
    const test = current ? current+" "+w : w;
    if(test.length > maxChars && current){ lines.push(current); current = w; }
    else current = test;
  });
  if(current) lines.push(current);
  return lines;
}

// Builds the pie/wheel SVG: one equal-angle wedge per category present on the platter (so it
// always forms a complete circle, regardless of how many categories a couple ends up with),
// category name labeled just outside the rim, and that category's item labels stacked inside.
function buildCertificateWheelSvg(groupedByCategory){
  const categories = Object.keys(groupedByCategory).sort();
  const n = categories.length;
  if(n === 0) return "";
  const size = 640, cx = size/2, cy = size/2, r = 220, labelR = r + 36, itemR = r * 0.6;
  const maxChars = n <= 4 ? 22 : (n <= 8 ? 16 : 12);
  // Category labels sit outside the rim and, unlike item labels, are bold/uppercase (wider per
  // character) and were previously a single un-wrapped line — long names like "Collaborative
  // Partnership" or "Co-Caregiving" would run past the SVG's viewBox and get clipped on export/
  // print. Wrapping them (same word-wrap helper as the item labels) plus a generous horizontal
  // viewBox margin below keeps that from happening in all but the most extreme cases.
  const maxLabelChars = n <= 4 ? 20 : (n <= 8 ? 14 : 10);
  const padX = 110, padY = 22;

  function polar(radius, angleDeg){
    const rad = (angleDeg - 90) * Math.PI / 180; // -90 so angle 0 points to 12 o'clock
    return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
  }

  let wedgesSvg = "", labelsSvg = "", itemsSvg = "";

  categories.forEach((cat, i)=>{
    const start = i * (360/n);
    const end = (i+1) * (360/n);
    const mid = (start+end)/2;
    const color = CERT_WEDGE_COLORS[i % CERT_WEDGE_COLORS.length];

    if(n === 1){
      wedgesSvg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="#fdfaf3" stroke-width="3"/>`;
    } else {
      const p1 = polar(r, start), p2 = polar(r, end);
      const largeArc = (end-start) > 180 ? 1 : 0;
      wedgesSvg += `<path d="M${cx},${cy} L${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)} Z" fill="${color}" stroke="#fdfaf3" stroke-width="3"/>`;
    }

    const lp = polar(labelR, mid);
    let anchor = "middle";
    if(n > 1){
      if(mid > 15 && mid < 165) anchor = "start";
      else if(mid > 195 && mid < 345) anchor = "end";
    }
    const labelLines = wrapCertLabel(cat, maxLabelChars);
    const labelLineHeight = 15;
    const labelTotalHeight = labelLines.length * labelLineHeight;
    labelLines.forEach((line, li)=>{
      const ly = lp.y - labelTotalHeight/2 + li*labelLineHeight + labelLineHeight*0.75;
      labelsSvg += `<text x="${lp.x.toFixed(2)}" y="${ly.toFixed(2)}" class="cert-wheel-label" text-anchor="${anchor}">${esc(line)}</text>`;
    });

    const rawItems = groupedByCategory[cat].map(([,it])=>it.label);
    const lines = [];
    rawItems.forEach(label=>{ wrapCertLabel(label, maxChars).forEach(l=>lines.push(l)); });
    const lineHeight = 14;
    const totalHeight = lines.length * lineHeight;
    const base = polar(itemR, mid);
    lines.forEach((line, li)=>{
      const y = base.y - totalHeight/2 + li*lineHeight + lineHeight*0.75;
      itemsSvg += `<text x="${base.x.toFixed(2)}" y="${y.toFixed(2)}" class="cert-wheel-item" text-anchor="middle">${esc(line)}</text>`;
    });
  });

  return `<svg viewBox="${-padX} ${-padY} ${size+2*padX} ${size+2*padY}" class="cert-wheel-svg" xmlns="http://www.w3.org/2000/svg">
    ${wedgesSvg}${itemsSvg}${labelsSvg}
  </svg>`;
}

// One-page, print-only "plaque" of just the Platter items — deliberately styled like a printed
// certificate (serif type, ornamental border, cream background, category wheel) rather than a
// webpage, since it's meant to be saved as a PDF via the browser's print dialog and framed/printed.
function renderCertificate(session, platterEntries){
  if(!session) return "";
  const names = session.participants.join(" & ");
  const dateStr = new Date().toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
  const grouped = groupItemsByCategory(platterEntries);
  const bodyHtml = platterEntries.length
    ? `<div class="cert-wheel-wrap">${buildCertificateWheelSvg(grouped)}</div>`
    : `<div class="cert-empty">Nothing on the platter yet — once you both agree on items, they'll appear here.</div>`;

  return `
  <div id="print-certificate" class="print-only">
    <div class="cert-border">
      <div class="cert-inner">
        <div class="cert-heart">♥</div>
        <div class="cert-title">Relationship<br>Smorgasbord</div>
        <div class="cert-for">for ${esc(names)}</div>
        ${bodyHtml}
        <div class="cert-footer">Created together on ${dateStr}</div>
      </div>
    </div>
  </div>`;
}

function renderResults(){
  const session = state.session;
  if(!session){
    return `${topBar("")}<div class="card empty-state">No results yet. Go to Combine Ratings to build a session.</div>
    <div class="card"><button class="btn" data-action="go-combine">Combine Ratings</button></div>`;
  }
  // Items everyone rated "Not Interested" are fully excluded — they never render
  // anywhere on this page, so that answer is never exposed to a partner.
  const entries = Object.entries(session.items).filter(([,it])=>it.status!=="hidden");
  const platter = entries.filter(([,it])=>it.status==="platter");
  const discuss = entries.filter(([,it])=>it.status==="discuss");
  const parked = entries.filter(([,it])=>it.status==="parked");
  const removed = entries.filter(([,it])=>it.status==="removed");

  const platterBody = platter.length ? renderSectionBody(platter,"platter") : `<div class="empty-state">Nothing here yet — items land here once everyone rates them "Def want this."</div>`;
  const discussBody = discuss.length ? renderSectionBody(discuss,"discuss") : `<div class="empty-state">Nothing flagged for discussion right now.</div>`;
  const parkedBody = parked.length ? renderSectionBody(parked,"parked") : `<div class="empty-state">Nothing here.</div>`;
  const removedBody = removed.length ? renderSectionBody(removed,"removed") : `<div class="empty-state">Nothing removed. Anything you remove from a section above lands here so you can bring it back later.</div>`;

  return `
  ${topBar("", `<button class="btn ghost" data-action="go-combine">Import Ratings</button>`)}

  <div class="card results-hero">
    <h2 class="results-hero-title">Nom nom</h2>
    <div class="results-hero-names">${session.participants.map(esc).join(" & ")}</div>
    <div class="row results-hero-actions">
      <button class="btn small" data-action="export-session">Save Session to Device</button>
    </div>
  </div>

  ${renderAccordionSection("platter", "\u{1F49C}", "Your top, shared desires", platter.length, platterBody)}
  ${renderAccordionSection("discuss", "\u{1F914}", "Ready for deeper discussion", discuss.length, discussBody)}
  ${renderAccordionSection("parked", "\u{2B07}️", "Misaligned or double neutrals", parked.length, parkedBody)}
  ${renderAccordionSection("removed", "\u{1F5D1}️", "Recently Removed Items", removed.length, removedBody)}

  <div class="add-item-footer">
    <h2>Add a custom item</h2>
    <p class="muted">Something came up in conversation that isn't on the original list? Add it directly to a
    section below.</p>
    <div class="add-item-form">
      <div>
        <label class="field-label">Category</label>
        <select id="new-item-category">
          ${CATEGORIES.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("")}
          <option value="Other">Other / Not Listed</option>
        </select>
      </div>
      <div>
        <label class="field-label">Item name</label>
        <input type="text" id="new-item-label" placeholder="e.g. Joint travel planning">
      </div>
      <div>
        <label class="field-label">Suggested by (optional)</label>
        <input type="text" id="new-item-by" placeholder="e.g. Alex">
      </div>
      <div>
        <label class="field-label">Place it on</label>
        <select id="new-item-status">
          <option value="platter">Your top, shared desires</option>
          <option value="discuss" selected>Ready for deeper discussion</option>
          <option value="parked">Misaligned or double neutrals</option>
        </select>
      </div>
      <div><button class="btn" data-action="add-custom-item">Add Item</button></div>
    </div>
  </div>

  <div class="card row between">
    <div>
      <div class="muted" style="font-size:0.85rem;">Ready to keep a copy?</div>
      <h2 style="margin-top:2px;">Print your unique platter</h2>
      <p class="muted" style="margin:4px 0 0;">Opens your browser's print dialog — choose "Save as PDF" for a
      one-page, 8.5×11 keepsake of everything you both agreed on.</p>
    </div>
    <button class="btn" data-action="print-certificate"><span class="emoji">\u{1F5A8}️</span> Print a PDF</button>
  </div>

  <div class="footer-note">Session last updated ${new Date(session.lastUpdated).toLocaleString()}. Save your
  session file to keep this up to date across devices and future conversations.</div>

  ${renderCertificate(session, platter)}
  `;
}

function renderResultItem(id, it, kind, opts){
  opts = opts || {};
  const categoryTag = opts.showCategory ? `<div class="item-category-tag">${esc(it.category)}</div>` : "";
  let flagLine = "";
  if(kind==="discuss"){
    if(it.statusReason==="flagged" && it.flaggedBy && it.flaggedBy.length){
      flagLine = `<div class="flag-note">Added to the discussion agenda by ${it.flaggedBy.map(esc).join(" & ")}</div>`;
    } else if(it.statusReason==="conflict"){
      flagLine = `<div class="flag-note">Mixed ratings — worth talking through</div>`;
    } else if(it.isCustom){
      flagLine = `<div class="flag-note">${it.addedBy ? "Suggested by "+esc(it.addedBy) : "Added during discussion"}</div>`;
    }
  } else if(kind==="removed"){
    flagLine = `<div class="flag-note">Removed${it.removedAt ? " on "+new Date(it.removedAt).toLocaleDateString() : ""}</div>`;
  } else if(it.isCustom){
    flagLine = `<div class="flag-note">${it.addedBy ? "Suggested by "+esc(it.addedBy) : "Manually added"}</div>`;
  }
  const detail = Object.keys(it.ratingsByParticipant||{}).length ? `<div class="ratings-detail">${renderRatingsDetail(it)}</div>` : "";

  let actions = "";
  if(kind==="discuss"){
    actions = `
      <div class="result-item-actions">
        <button class="btn small" data-action="move-item" data-id="${id}" data-target="platter">Move to Shared Desires</button>
        <button class="btn small ghost" data-action="move-item" data-id="${id}" data-target="parked">Move to Misaligned</button>
        <button class="btn small danger-outline" data-action="remove-item" data-id="${id}">Remove</button>
      </div>`;
  } else if(kind==="parked"){
    actions = `
      <div class="result-item-actions">
        <button class="btn small secondary" data-action="move-item" data-id="${id}" data-target="discuss">Move to Discussion</button>
        <button class="btn small ghost" data-action="move-item" data-id="${id}" data-target="platter">Move to Shared Desires</button>
        <button class="btn small danger-outline" data-action="remove-item" data-id="${id}">Remove</button>
      </div>`;
  } else if(kind==="platter"){
    actions = `
      <div class="result-item-actions">
        <button class="btn small ghost" data-action="move-item" data-id="${id}" data-target="discuss">Move to Discussion</button>
        <button class="btn small danger-outline" data-action="remove-item" data-id="${id}">Remove</button>
      </div>`;
  } else if(kind==="removed"){
    actions = `
      <div class="result-item-actions">
        <button class="btn small secondary" data-action="restore-item" data-id="${id}">Restore</button>
        <button class="btn small danger-outline" data-action="delete-permanent" data-id="${id}">Delete Permanently</button>
      </div>`;
  }

  const isFav = !!it.favorite;
  const favLabel = FAVORITE_STAR_LABELS[kind] || "Priority for us";
  return `
  <div class="result-item ${kind}-item ${isFav?'favorited':''}">
    <div class="result-item-top">
      <div class="result-item-main">
        ${categoryTag}
        <strong>${esc(it.label)}</strong>
        ${flagLine}
        ${detail}
      </div>
      <div class="favorite-control">
        ${isFav ? `<span class="very-important-label">${esc(favLabel)}</span>` : ""}
        <button class="star-btn ${isFav?'active':''}" data-action="toggle-favorite" data-id="${id}"
                aria-label="${isFav ? 'Remove from '+esc(favLabel) : 'Mark as '+esc(favLabel)}" title="${isFav ? 'Remove from '+esc(favLabel) : 'Mark as '+esc(favLabel)}">${isFav ? '★' : '☆'}</button>
      </div>
    </div>
    ${actions}
  </div>`;
}

/* ============================= RESULTS ACTIONS ============================= */
const STATUS_LABELS = { platter:"Your top, shared desires", discuss:"Ready for deeper discussion", parked:"Misaligned or double neutrals" };

function toggleFavorite(id){
  const it = state.session.items[id];
  if(!it) return;
  it.favorite = !it.favorite;
  state.session.lastUpdated = new Date().toISOString();
  persist();
  withScrollPreserved(render);
  showToast(it.favorite ? "Marked as very important" : "Removed from favorites");
}
function moveItem(id, target){
  const it = state.session.items[id];
  if(!it) return;
  it.status = target;
  it.movedManually = true;
  state.session.lastUpdated = new Date().toISOString();
  persist();
  withScrollPreserved(render);
  showToast("Moved to "+(STATUS_LABELS[target]||target));
}
// Removing an item is non-destructive: it moves to "Recently Removed Items" so it can be
// restored later. Permanent deletion is a separate, explicit action from that section.
function removeItem(id){
  const it = state.session.items[id];
  if(!it) return;
  it.previousStatus = it.status;
  it.status = "removed";
  it.movedManually = true;
  it.removedAt = new Date().toISOString();
  state.session.lastUpdated = new Date().toISOString();
  persist();
  withScrollPreserved(render);
  showToast("Moved to Recently Removed Items");
}
function restoreItem(id){
  const it = state.session.items[id];
  if(!it) return;
  it.status = it.previousStatus || "parked";
  it.movedManually = true;
  delete it.removedAt;
  delete it.previousStatus;
  state.session.lastUpdated = new Date().toISOString();
  persist();
  withScrollPreserved(render);
  showToast("Restored to "+(STATUS_LABELS[it.status]||"results"));
}
function deletePermanent(id){
  if(!confirm("Permanently delete this item? This can't be undone.")) return;
  delete state.session.items[id];
  state.session.lastUpdated = new Date().toISOString();
  persist();
  withScrollPreserved(render);
}
function addCustomItem(){
  const category = document.getElementById("new-item-category").value;
  const label = document.getElementById("new-item-label").value.trim();
  const by = document.getElementById("new-item-by").value.trim();
  const status = document.getElementById("new-item-status").value;
  if(!label){ showToast("Enter an item name first"); return; }
  if(!state.session) state.session = newEmptySession();
  state.session.customCounter = (state.session.customCounter||0)+1;
  const id = "custom__"+slugify(category)+"__"+slugify(label)+"__"+state.session.customCounter;
  state.session.items[id] = {
    category: category, label: label, ratingsByParticipant:{}, status: status,
    movedManually:true, isCustom:true, addedBy: by||null
  };
  state.session.lastUpdated = new Date().toISOString();
  persist();
  render();
  showToast("Added “"+label+"”");
}

/* ============================= EXPORT ACTIONS ============================= */
function exportRatings(){
  const { total, answered } = ratingProgress();
  if(answered < total){
    fixErrorsMode = true;
    // Always start collapsed on entry -- the accordion's open/closed state persists across
    // renders (it's not reset by ratingProgress or the mode toggle), so if the user had opened
    // it earlier just to look something up, entering fix-errors mode later shouldn't dump 40
    // already-done items in their face instead of the uncompleted ones they need to see.
    sectionOpen.rated = false;
    const thingsLeft = total - answered;
    showToast(`${thingsLeft} thing${thingsLeft===1?'':'s'} left — let's finish up!`);
    render();
    // The sticky bar now carries the "uncompleted items" heading itself (it's a single merged
    // bar, not a bar + separate header), so scrolling it to the top of the viewport is enough --
    // no more risk of landing mid-way through an open "already rated" accordion, since that gets
    // force-collapsed above.
    document.querySelector(".fix-errors-bar")?.scrollIntoView({ block:"start" });
    return;
  }
  const payload = {
    type:"smorgasbord-ratings", version:1,
    participant: state.rating.name, timestamp: new Date().toISOString(),
    ratings: state.rating.ratings
  };
  downloadJSON(payload, `smorgasbord-ratings-${slugify(state.rating.name)}-${filenameTimestamp()}.json`);
  state.rating.submitted = true;
  persist();
  showToast("Exported! Send this file to whoever is compiling results.");
}
function exportProgress(){
  if(!state.rating.name){ showToast("Enter your name first"); showNameFieldError(); return; }
  const { answered, total } = ratingProgress();
  const payload = {
    type:"smorgasbord-progress", version:1,
    participant: state.rating.name, timestamp: new Date().toISOString(),
    ratings: state.rating.ratings
  };
  downloadJSON(payload, `smorgasbord-progress-${slugify(state.rating.name)}-${filenameTimestamp()}.json`);
  showToast(`Progress saved (${answered} of ${total}). Keep this file — you can resume from it any time.`);
}
function handleProgressFileSelected(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.type==="smorgasbord-progress" || data.type==="smorgasbord-ratings"){
        state.rating = { name: data.participant||"", ratings: Object.assign({}, data.ratings||{}), submitted:false };
        state.view = "rate";
        persist();
        render();
        showToast(data.participant ? `Resumed as ${data.participant} — pick up where you left off.` : "Resumed — pick up where you left off.");
      } else {
        showToast("That doesn't look like a smorgasbord ratings/progress file.");
      }
    }catch(err){
      showToast("Couldn't read that file.");
    }
  };
  reader.readAsText(file);
}
function exportSession(){
  if(!state.session) return;
  downloadJSON(state.session, `smorgasbord-session-${filenameTimestamp()}.json`);
  showToast("Session saved. Share this file to keep everyone's devices in sync.");
}

/* ============================= EVENT WIRING ============================= */
function attachGlobalHandlers(){
  const app = document.getElementById("app");

  app.onclick = function(e){
    const target = e.target.closest("[data-action]");
    if(!target) return;
    const action = target.dataset.action;

    if(action==="go-home"){ state.view="home"; persist(); render(); }
    else if(action==="reset-all"){ resetAll(); }
    else if(action==="start-rate"){ state.view="rate"; persist(); render(); }
    else if(action==="go-combine"){ state.view="combine"; persist(); render(); }
    else if(action==="go-results"){ state.view="results"; persist(); render(); }
    else if(action==="trigger-file-input"){ document.getElementById("file-input").click(); }
    else if(action==="remove-loaded-file"){
      state.loadedFiles.splice(parseInt(target.dataset.index,10),1);
      persist(); render();
    }
    else if(action==="build-results"){ buildResultsFromLoadedFiles(); }
    else if(action==="export-ratings"){ exportRatings(); }
    else if(action==="save-progress"){ exportProgress(); }
    else if(action==="exit-fix-errors"){ fixErrorsMode = false; withScrollPreserved(render); }
    else if(action==="trigger-progress-file-input"){ document.getElementById("progress-file-input").click(); }
    else if(action==="trigger-session-file-input"){ document.getElementById("session-file-input").click(); }
    else if(action==="export-session"){ exportSession(); }
    else if(action==="move-item"){ moveItem(target.dataset.id, target.dataset.target); }
    else if(action==="remove-item"){ removeItem(target.dataset.id); }
    else if(action==="restore-item"){ restoreItem(target.dataset.id); }
    else if(action==="delete-permanent"){ deletePermanent(target.dataset.id); }
    else if(action==="toggle-favorite"){ toggleFavorite(target.dataset.id); }
    else if(action==="print-certificate"){ window.print(); }
    else if(action==="add-custom-item"){ addCustomItem(); }
    else if(action==="toggle-section"){
      const key = target.dataset.section;
      sectionOpen[key] = !sectionOpen[key];
      withScrollPreserved(render);
    }
    else if(action==="rate-item"){
      handleRateClick(target.dataset.item, target.dataset.value);
    }
    else if(action==="toggle-hints"){
      state.showHints = !state.showHints;
      persist();
      withScrollPreserved(render);
    }
  };

  const nameInput = document.getElementById("rater-name");
  if(nameInput){
    nameInput.oninput = function(){
      state.rating.name = nameInput.value;
      persist();
      if(state.rating.name) clearNameFieldError();
      // In fix-errors mode, moving the name field between "still needed" and the rest happens
      // on blur (below), not here -- reorganizing the DOM on every keystroke would yank focus
      // out from under whatever's being typed after the very first character.
      if(!fixErrorsMode){
        syncProgressDisplay();
        syncFinalActionButtons();
      }
    };
    nameInput.onblur = function(){
      // Deferred a tick: blurring by clicking straight from the name field onto a pill fires
      // this (via the focus change on mousedown) *before* that click's own mouseup/click pair
      // is dispatched. Re-rendering synchronously here would shift the item list under the
      // in-flight click (the name card reappearing above it pushes everything down), causing
      // the click to land on whatever's now at that screen position instead of the pill. The
      // pill's own click handler re-renders anyway once it runs, so this mostly just covers
      // blurring without an immediate follow-up click (tabbing away, clicking blank space).
      if(fixErrorsMode) setTimeout(function(){ withScrollPreserved(render); }, 0);
    };
  }

  const fileInput = document.getElementById("file-input");
  if(fileInput){
    fileInput.onchange = function(){
      if(fileInput.files.length) handleFilesSelected(fileInput.files);
      fileInput.value = "";
    };
  }

  // Drag-and-drop onto the Combine screen's file-drop zone, in addition to click-to-browse.
  const fileDropZone = document.getElementById("file-drop-zone");
  if(fileDropZone){
    fileDropZone.ondragover = function(e){
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = "copy";
      fileDropZone.classList.add("dragover");
    };
    fileDropZone.ondragleave = function(e){
      // dragleave also fires when moving between child elements of the drop zone; only clear
      // the highlight once the pointer has actually left the zone itself.
      if(!fileDropZone.contains(e.relatedTarget)) fileDropZone.classList.remove("dragover");
    };
    fileDropZone.ondrop = function(e){
      e.preventDefault();
      fileDropZone.classList.remove("dragover");
      const dropped = e.dataTransfer && e.dataTransfer.files;
      if(dropped && dropped.length) handleFilesSelected(dropped);
    };
  }

  const progressFileInput = document.getElementById("progress-file-input");
  if(progressFileInput){
    progressFileInput.onchange = function(){
      if(progressFileInput.files.length) handleProgressFileSelected(progressFileInput.files[0]);
      progressFileInput.value = "";
    };
  }

  const sessionFileInput = document.getElementById("session-file-input");
  if(sessionFileInput){
    sessionFileInput.onchange = function(){
      if(sessionFileInput.files.length) handleHomeSessionFileSelected(sessionFileInput.files);
      sessionFileInput.value = "";
    };
  }

  // The progress bar only reveals itself once its own card has scrolled up near the top of the
  // viewport (rather than sitting there redundantly while the name field at the very top is
  // still in view). Since render() rebuilds the DOM from scratch, re-sync its visibility to the
  // current scroll position right away — don't wait for the next scroll event to correct it.
  syncProgressBarScrollState();
}

function syncProgressBarScrollState(){
  const bar = document.querySelector(".progress-wrap");
  if(!bar) return;
  const card = bar.closest(".card");
  if(!card){ bar.classList.remove("scrolled"); return; }
  // Geometry-based, not a fixed scrollY count: reveal only once the bar's own container card
  // has scrolled up near the top of the viewport (within an 8px buffer) -- roughly the point
  // where the sticky bar is actually about to pin itself in place. This requires meaningfully
  // more scrolling than the old "any scrollY > 0" threshold, which revealed it after a single
  // pixel of movement, and it scales correctly regardless of how tall the page/name-field/etc
  // above the card happens to be.
  bar.classList.toggle("scrolled", card.getBoundingClientRect().top <= 8);
}

function handleRateClick(itemId, value){
  state.rating.ratings[itemId] = value;
  persist();
  if(fixErrorsMode){
    // The item needs to actually move from "still needed" to the "already rated" accordion
    // (or the whole mode needs to auto-exit, if that was the last thing left), not just get a
    // class toggled in place -- a full render() is the simplest way to get that reorganization
    // right, and unlike typing in the name field there's no focus/cursor position to lose from
    // a pill click, so there's no reason to avoid it here the way the direct-patch path below does.
    withScrollPreserved(render);
    return;
  }
  // direct DOM update, no full re-render, to avoid losing scroll position in the long form
  const group = document.querySelector(`.pill-group[data-item="${cssEscape(itemId)}"]`);
  if(group){
    group.classList.add("answered");
    group.querySelectorAll(".pill").forEach(p=>{
      p.classList.toggle("selected", p.dataset.value===value);
    });
  }
  syncProgressDisplay();
  syncFinalActionButtons();
}
// Shared by handleRateClick and nameInput.oninput (below) -- both patch the DOM directly
// instead of re-rendering, and now that the name counts as one more thing toward total/answered
// (see ratingProgress()), typing a name moves the bar/text too, not just rating an item.
function syncProgressDisplay(){
  const { total, answered } = ratingProgress();
  const pct = Math.round((answered/total)*100);
  const fill = document.getElementById("progress-fill");
  const text = document.getElementById("progress-text");
  if(fill) fill.style.width = pct+"%";
  if(text) text.textContent = `${answered} of ${total}`;
}
function cssEscape(s){
  return String(s).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
}

/* ============================= BACKGROUND BLOB ============================= */
// The "interactive" blob eases toward the cursor. Deliberately event-driven (updates the
// transform directly on mousemove, smoothed by a CSS transition) rather than a manual
// requestAnimationFrame lerp loop — same visual effect, but with no perpetually-rescheduling
// animation frame that would keep running (and, e.g., keep a headless/test process alive) forever.
(function initInteractiveBlob(){
  const interBubble = document.querySelector(".gradient-bg .interactive");
  if(!interBubble) return;
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduceMotion) return;
  window.addEventListener("mousemove", function(e){
    interBubble.style.transform = `translate(${Math.round(e.clientX)}px, ${Math.round(e.clientY)}px)`;
  });
})();

// Reveal the rate-view progress bar once the page is scrolled. A single listener attached once
// (rather than re-attached on every render) that re-queries the current .progress-wrap each
// time it fires, so it stays correct across the full-DOM-replace re-renders elsewhere in the app.
window.addEventListener("scroll", syncProgressBarScrollState, { passive: true });

// Re-run the auto-fit sizing on resize (debounced) and once the Google Font actually
// finishes loading -- the first fitHeroTitle()/fitResultsNames() calls at init likely
// measured a fallback system font, since Agu Display loads asynchronously.
let heroTitleResizeTimer;
window.addEventListener("resize", function(){
  clearTimeout(heroTitleResizeTimer);
  heroTitleResizeTimer = setTimeout(function(){ fitHeroTitle(); fitResultsNames(); }, 120);
});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitHeroTitle(); fitResultsNames(); });

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
